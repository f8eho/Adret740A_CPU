[platformio]
default_envs = megaatmega2560

[common]
base_build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror=return-type
  -Wl,--undefined=adretCalibrationCorrectionTable
  -DADRET_DEBUG_SERIAL=0
  -DADRET_REMOTE_SERIAL=1

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
  ${common.base_build_flags}
  -DADRET_INSTRUMENT_BUS_BENCH=0
  -DADRET_I2C_PROBE=0

[env:megaatmega1280]
extends = env:megaatmega2560
board = megaatmega1280

[env:instrument_bus_bench]
extends = env:megaatmega2560
build_flags =
  ${common.base_build_flags}
  -DADRET_INSTRUMENT_BUS_BENCH=1
  -DADRET_I2C_PROBE=0

[env:i2c_probe]
extends = env:megaatmega2560
build_flags =
  ${common.base_build_flags}
  -DADRET_INSTRUMENT_BUS_BENCH=0
  -DADRET_I2C_PROBE=1
